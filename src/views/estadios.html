<section class="max-w-6xl mx-auto px-4 sm:px-6 pt-20 pb-16">
  <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Escenarios</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Inspección del estadio antes del partido</p>
    </div>
    <button type="button" onclick="generarInformePericialEstadio()" class="inline-flex items-center gap-1.5 h-9 px-3.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-semibold transition-colors">
      <span class="material-symbols-outlined text-base">download</span> Descargar informe
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- Estadio -->
    <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111827] p-5">
      <span class="material-symbols-outlined text-3xl text-indigo-600 dark:text-indigo-400">stadium</span>
      <h2 class="mt-2 text-lg font-bold text-slate-900 dark:text-white">Estadio Rodrigo Paz Delgado</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400">Quito · 2.850 m · 41.575 espectadores</p>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-3">Próximo partido: <span class="font-medium text-slate-700 dark:text-slate-200">LDU vs Barcelona SC, 18:00</span></p>
      <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Resultado</p>
        <span id="badge-calificacion-estadio" class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">Sin evaluar</span>
      </div>
    </div>

    <!-- Formulario de inspección -->
    <form class="lg:col-span-2 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111827] p-5" onsubmit="event.preventDefault(); evaluarEscenarioEnVivo();">
      <h2 class="text-base font-bold text-slate-900 dark:text-white mb-4">Medidas de la inspección</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="block">
          <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Altura del césped (mm)</span>
          <input id="input-cesped-mm" type="number" step="0.1" value="22.5" class="mt-1 w-full h-10 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600" />
          <span class="text-xs text-slate-400">Permitido: 20 a 25 mm</span>
        </label>
        <label class="block">
          <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Distancia al hospital (min)</span>
          <input id="input-hospital-min" type="number" value="12" class="mt-1 w-full h-10 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600" />
          <span class="text-xs text-slate-400">Máximo: 15 min</span>
        </label>
        <label class="block">
          <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Conexión VAR (Mbps)</span>
          <input id="input-var-mb" type="number" value="200" class="mt-1 w-full h-10 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600" />
          <span class="text-xs text-slate-400">Mínimo: 100 Mbps</span>
        </label>
        <label class="block">
          <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Voltaje (V)</span>
          <input id="input-voltaje-v" type="number" value="220" class="mt-1 w-full h-10 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600" />
          <span class="text-xs text-slate-400">Permitido: 210 a 230 V</span>
        </label>
      </div>
      <div class="mt-5 flex justify-end">
        <button type="submit" class="inline-flex items-center gap-1.5 h-9 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-colors">
          <span class="material-symbols-outlined text-base">fact_check</span> Evaluar estadio
        </button>
      </div>
    </form>
  </div>
</section>
