<section class="min-h-screen flex items-center justify-center px-4 pt-20 pb-12">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <img src="assets/ligapro-mini.svg" alt="LigaPro" class="h-14 w-auto mx-auto mb-3" />
      <h1 class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white">Bienvenido a LigaPro</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Gestión de competiciones</p>
    </div>

    <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111827] p-6 shadow-sm">
      <div class="grid grid-cols-2 p-1 mb-5 rounded-lg bg-slate-100 dark:bg-slate-800/60 text-sm font-semibold" role="tablist">
        <button type="button" id="tab-btn-login" onclick="toggleAuthTab('login')" class="auth-tab py-1.5 rounded-md">Iniciar sesión</button>
        <button type="button" id="tab-btn-signup" onclick="toggleAuthTab('signup')" class="auth-tab py-1.5 rounded-md">Crear cuenta</button>
      </div>

      <!-- Iniciar sesión -->
      <div id="auth-section-login">
        <form id="login-form" onsubmit="loginFormSubmit(event)" class="space-y-4">
          <label class="block">
            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Correo electrónico</span>
            <input type="email" id="login-email" required autocomplete="email" placeholder="tu.correo@ejemplo.com" class="mt-1 w-full h-10 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600" />
          </label>
          <label class="block">
            <span class="flex items-center justify-between">
              <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Contraseña</span>
              <a href="javascript:void(0)" onclick="abrirRecuperarPassword()" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">¿Olvidó contraseña?</a>
            </span>
            <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" class="mt-1 w-full h-10 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600" />
          </label>
          <button type="submit" id="btn-login-submit" class="w-full h-10 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold flex items-center justify-center gap-1.5 transition-colors">
            Iniciar sesión
          </button>
        </form>
      </div>

      <!-- Crear cuenta -->
      <div id="auth-section-signup" class="hidden">
        <form id="signup-form" onsubmit="signupFormSubmit(event)" class="space-y-4">
          <label class="block">
            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Nombre completo</span>
            <input type="text" id="signup-nombre" required autocomplete="name" placeholder="Juan Pérez" class="mt-1 w-full h-10 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600" />
          </label>
          <label class="block">
            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Cédula</span>
            <input type="text" id="signup-cedula" required inputmode="numeric" placeholder="1712345678" class="mt-1 w-full h-10 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600" />
          </label>
          <label class="block">
            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Correo electrónico</span>
            <input type="email" id="signup-email" required autocomplete="email" placeholder="tu.correo@ejemplo.com" class="mt-1 w-full h-10 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600" />
          </label>
          <label class="block">
            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Contraseña</span>
            <input type="password" id="signup-password" minlength="6" required autocomplete="new-password" placeholder="Mínimo 6 caracteres" class="mt-1 w-full h-10 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600/30 focus:border-indigo-600" />
          </label>
          <button type="submit" id="btn-signup-submit" class="w-full h-10 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold flex items-center justify-center gap-1.5 transition-colors">
            Crear cuenta
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
