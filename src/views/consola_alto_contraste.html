<div class="w-full min-h-screen bg-[#000] text-[#fff]">
<section class="max-w-6xl mx-auto px-4 sm:px-6 pt-20 pb-16">
  <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight text-[#FFE600]">Consola · Alto contraste</h1>
      <p class="text-base text-[#fff] mt-1" data-c="estadio">Estadio</p>
    </div>
    <div class="inline-flex p-1 rounded-lg border-2 border-[#FFE600] text-sm font-bold" aria-label="Modo de consola">
      <button type="button" onclick="navigateView('consola')" class="px-3 py-1.5 rounded-md text-[#fff] hover:underline">Estándar</button>
      <button type="button" onclick="navigateView('consola_alto_contraste')" class="px-3 py-1.5 rounded-md bg-[#FFE600] text-[#000]">Alto contraste</button>
      <button type="button" onclick="navigateView('consola_tablet')" class="px-3 py-1.5 rounded-md text-[#fff] hover:underline">Tablet</button>
    </div>
  </div>

  <div data-c="acta-cerrada" class="hidden mb-5 rounded-xl border-4 border-[#FFE600] px-5 py-4 text-lg font-extrabold text-[#FFE600]">
    ACTA CERRADA Y FIRMADA · Solo lectura
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-5 gap-5">
    <div class="lg:col-span-3 space-y-5">
      <div class="rounded-2xl border-4 border-[#FFE600] p-6">
        <p class="text-center text-lg font-bold text-[#FFE600] mb-4" data-c="minuto">En vivo</p>
        <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-4">
          <span data-c="local-nombre" class="text-base sm:text-xl font-extrabold text-center leading-tight line-clamp-2 break-words">Local</span>
          <div class="text-5xl sm:text-7xl font-extrabold tabular-nums text-[#FFE600]">
            <span data-c="marcador-local">0</span><span class="mx-3">-</span><span data-c="marcador-visitante">0</span>
          </div>
          <span data-c="visitante-nombre" class="text-base sm:text-xl font-extrabold text-center leading-tight line-clamp-2 break-words">Visitante</span>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <p data-c="local-nombre" class="mb-2 text-lg font-extrabold text-[#FFE600] truncate">Local</p>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" data-c-requiere-acta-abierta onclick="abrirRegistroEvento('gol', 'local')" class="h-16 rounded-xl bg-[#FFE600] text-[#000] text-xl font-extrabold focus:outline-none focus:ring-4 focus:ring-[#fff]">Gol</button>
            <button type="button" data-c-requiere-acta-abierta onclick="abrirRegistroEvento('sustitucion', 'local')" class="h-16 rounded-xl bg-[#000] text-[#fff] text-xl font-extrabold border-4 border-[#fff] focus:outline-none focus:ring-4 focus:ring-[#FFE600]">Cambio</button>
            <button type="button" data-c-requiere-acta-abierta onclick="abrirRegistroEvento('amarilla', 'local')" class="h-16 rounded-xl bg-[#000] text-[#FFE600] text-xl font-extrabold border-4 border-[#FFE600] focus:outline-none focus:ring-4 focus:ring-[#fff]">Amarilla</button>
            <button type="button" data-c-requiere-acta-abierta onclick="abrirRegistroEvento('roja', 'local')" class="h-16 rounded-xl bg-[#FF3B30] text-[#000] text-xl font-extrabold focus:outline-none focus:ring-4 focus:ring-[#fff]">Roja</button>
          </div>
        </div>
        <div>
          <p data-c="visitante-nombre" class="mb-2 text-lg font-extrabold text-[#FFE600] truncate">Visitante</p>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" data-c-requiere-acta-abierta onclick="abrirRegistroEvento('gol', 'visitante')" class="h-16 rounded-xl bg-[#FFE600] text-[#000] text-xl font-extrabold focus:outline-none focus:ring-4 focus:ring-[#fff]">Gol</button>
            <button type="button" data-c-requiere-acta-abierta onclick="abrirRegistroEvento('sustitucion', 'visitante')" class="h-16 rounded-xl bg-[#000] text-[#fff] text-xl font-extrabold border-4 border-[#fff] focus:outline-none focus:ring-4 focus:ring-[#FFE600]">Cambio</button>
            <button type="button" data-c-requiere-acta-abierta onclick="abrirRegistroEvento('amarilla', 'visitante')" class="h-16 rounded-xl bg-[#000] text-[#FFE600] text-xl font-extrabold border-4 border-[#FFE600] focus:outline-none focus:ring-4 focus:ring-[#fff]">Amarilla</button>
            <button type="button" data-c-requiere-acta-abierta onclick="abrirRegistroEvento('roja', 'visitante')" class="h-16 rounded-xl bg-[#FF3B30] text-[#000] text-xl font-extrabold focus:outline-none focus:ring-4 focus:ring-[#fff]">Roja</button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button type="button" data-c-requiere-acta-abierta onclick="registrarHidratacionEnVivo()" class="h-14 rounded-xl bg-[#000] text-[#fff] text-lg font-extrabold border-4 border-[#fff] focus:outline-none focus:ring-4 focus:ring-[#FFE600]">Hidratación</button>
        <button type="button" data-c-requiere-acta-abierta onclick="abrirRegistroIncidente()" class="h-14 rounded-xl bg-[#000] text-[#fff] text-lg font-extrabold border-4 border-[#fff] focus:outline-none focus:ring-4 focus:ring-[#FFE600]">Incidente</button>
      </div>
    </div>

    <div class="lg:col-span-2 rounded-2xl border-4 border-[#fff] flex flex-col">
      <div class="px-5 py-4 border-b-4 border-[#fff]">
        <h2 class="text-xl font-extrabold text-[#FFE600]">Bitácora</h2>
        <span data-c="eventos-resumen" class="text-sm text-[#fff]"></span>
      </div>
      <ul data-c="eventos" data-c-tema="alto" class="flex-1 max-h-[34rem] overflow-y-auto text-base"></ul>
      <div class="p-4 border-t-4 border-[#fff]">
        <button type="button" data-c-requiere-acta-abierta onclick="sellarPlanillaJuego()" class="w-full h-14 rounded-xl bg-[#fff] text-[#000] text-lg font-extrabold focus:outline-none focus:ring-4 focus:ring-[#FFE600]">Cerrar y firmar acta</button>
      </div>
    </div>
  </div>
</section>
</div>
