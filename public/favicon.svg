<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Gradiente índigo oficial institucional -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <!-- Gradiente dorado oficial de acento -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <!-- Filtro sombra suave -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Escudo Institucional Base -->
  <path d="M16 2.2 L27.5 5.8 C27.5 5.8 27.5 15.2 27.5 15.5 C27.5 22.8 22.2 28.5 16 30.5 C9.8 28.5 4.5 22.8 4.5 15.5 C4.5 15.2 4.5 5.8 4.5 5.8 L16 2.2 Z" fill="url(#shieldGrad)" stroke="#6366F1" stroke-width="0.8" filter="url(#softShadow)" />

  <!-- Borde Interno Dorado Acento -->
  <path d="M16 4.2 L25.5 7.2 C25.5 7.2 25.5 15.2 25.5 15.5 C25.5 21.6 21 26.5 16 28.3 C11 26.5 6.5 21.6 6.5 15.5 C6.5 15.2 6.5 7.2 6.5 7.2 L16 4.2 Z" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.9" />

  <!-- Costuras radiantes del balón estilizado -->
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.9" stroke-linecap="round">
    <line x1="16" y1="9.2" x2="16" y2="5.5" />
    <line x1="20.8" y1="12" x2="24.5" y2="9.8" />
    <line x1="20.8" y1="17.6" x2="24.8" y2="19.8" />
    <line x1="16" y1="20.4" x2="16" y2="24.2" />
    <line x1="11.2" y1="17.6" x2="7.2" y2="19.8" />
    <line x1="11.2" y1="12" x2="7.5" y2="9.8" />
  </g>

  <!-- Hexágono Central (Balón de Fútbol) con Acento Dorado -->
  <polygon points="16,9.2 20.8,12 20.8,17.6 16,20.4 11.2,17.6 11.2,12" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="0.9" stroke-linejoin="round" />

  <!-- Detalle geométrico interno del balón -->
  <circle cx="16" cy="14.8" r="1.6" fill="#1E1B4B" />

  <!-- Chevron / Acento de victoria dorado inferior -->
  <path d="M13.2 24.2 L16 26.2 L18.8 24.2" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
